asm = "9.10.1"
assertJ = "3.27.7"
build-health = "3.19.2"
error-prone-core = "2.50.0"
errorprone-plugin = "5.1.1"
foojay = "1.0.0"
git-hooks = "2.1.25"
git-version = "6.4.4"
gradle-develocity = "4.6.0"
