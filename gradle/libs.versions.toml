[libraries]
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "apache-commons-compress" }
commons-io = { module = "commons-io:commons-io", version = "2.22.0" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.21.0" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone-core" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
org-brotli-dec = { module = "org.brotli:dec", version.ref = "brotli-dec" }
org-tukaani-xz = { module = "org.tukaani:xz", version.ref = "tukaani-xz" }
com-github-luben-zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# TEST dependencies
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
archunit-junit5-api = { module = "com.tngtech.archunit:archunit-junit5-api", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertJ" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson-bom" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5-bom" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback"}
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback"}
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
build-health = { id = "com.autonomousapps.build-health", version.ref = "build-health" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
git-hooks = { id = "org.danilopianini.gradle-pre-commit-git-hooks", version.ref = "git-hooks" }
git-version = { id = "me.qoomon.git-versioning", version.ref = "git-version" }
gradle-develocity = { id = "com.gradle.develocity", version.ref = "gradle-develocity" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
