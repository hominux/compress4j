name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-wrapper:
    permissions:
      contents: read
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the checksum of gradle-wrapper.jar
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

  audit-workflows:
    permissions:
      contents: read
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1  # Pinned so a zizmor release adding audits cannot fail unrelated pull requests
          advanced-security: false  # Findings surface as annotations and the job result, not as code scanning alerts
          annotations: true

  commit-messages:
    permissions:
      contents: read
    name: Commit messages
    if: github.event_name == 'pull_request'
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # The whole branch is validated, not just its head
          persist-credentials: false
      - name: 'Set up JDK 21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Check commit messages and pull request title
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}  # Squash merges turn the title into the commit subject
        run: ./gradlew checkCommitMessages -Pcommits.base="origin/$BASE_REF" -Ppr.title="$PR_TITLE" --no-daemon

  build-ubuntu-21:
    permissions:
      contents: read
    name: Build (Ubuntu JDK 21)
    needs: validate-wrapper
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Job-level so the analysis step can test it in an `if`
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: 'Set up JDK 21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ubuntu-latest-jdk_21-sonar
          restore-keys: ubuntu-latest-jdk_21-sonar

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan
      - name: Upload build reports
        if: always()  # A failed coverage gate is exactly when the reports are needed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-ubuntu-jdk21
          path: |
            build/reports/
            build/test-results/
            gradle/build-logic/build/reports/
            gradle/build-logic/build/test-results/
            build/jacoco/*.exec
          retention-days: 14
          if-no-files-found: warn
      - name: Sonar analysis
        # Fork pull requests are never given repository secrets, so the scan would fail with a red X the contributor
        # cannot clear. The scanner reads the pull request context straight from the event it is running on.
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --no-daemon --scan

  build-ubuntu-25:
    permissions:
      contents: read
    name: Build (Ubuntu JDK 25)
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: 'Set up JDK 25'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            25
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan
      - name: Upload build reports
        if: always()  # A failed coverage gate is exactly when the reports are needed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-ubuntu-jdk25
          path: |
            build/reports/
            build/test-results/
            gradle/build-logic/build/reports/
            gradle/build-logic/build/test-results/
            build/jacoco/*.exec
          retention-days: 14
          if-no-files-found: warn

  build-other-os:
    permissions:
      contents: read
    name: Build (${{ matrix.operating-system }} JDK ${{ matrix.java-version }})
    needs: validate-wrapper
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ macos-latest, windows-latest ]
        java-version: [ 21, 25 ]

    steps:
      - name: Set git config for long paths
        if: matrix.operating-system == 'windows-latest'
        run: |
          git config --system core.longpaths true
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: 'Set up JDK ${{ matrix.java-version }}'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            ${{ matrix.java-version }}
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan
      - name: Upload build reports
        if: always()  # A failed coverage gate is exactly when the reports are needed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-${{ matrix.operating-system }}-jdk${{ matrix.java-version }}
          path: |
            build/reports/
            build/test-results/
            gradle/build-logic/build/reports/
            gradle/build-logic/build/test-results/
            build/jacoco/*.exec
          retention-days: 14
          if-no-files-found: warn

  # Stable check name for branch protection: the matrix reports as "Build (<os> JDK <version>)", so protecting the
  # combinations directly silently stops covering them whenever the matrix changes.
  build-matrix-result:
    permissions:
      contents: read
    name: Build (all platforms)
    runs-on: ubuntu-latest
    needs: build-other-os
    if: always()  # A skipped job never reports, so without this a failing matrix leaves the check pending forever
    steps:
      - name: Check matrix result
        env:
          MATRIX_RESULT: ${{ needs.build-other-os.result }}
        run: |
          if [ "$MATRIX_RESULT" != 'success' ]; then
            echo "build-other-os concluded: $MATRIX_RESULT"
            exit 1
          fi
