name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create docs site token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: hominux.github.io
          permission-contents: write

      - name: Dispatch update to docs site
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: hominux/hominux.github.io
          event-type: update-docs
          client-payload: '{"repository": "${{ github.repository }}", "ref": "main"}'
