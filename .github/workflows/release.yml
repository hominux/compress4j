name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only compute the release plan, do not tag or publish'
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a maintainer on main
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::Releases run from main, not $REF"
            exit 1
          fi
          role=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)
          case "$role" in
            admin|maintain) echo "$ACTOR has role $role" ;;
            *) echo "::error::$ACTOR has role '$role'; releasing needs admin or maintain"; exit 1 ;;
          esac

  plan:
    name: Plan
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      nextVersion: ${{ steps.plan.outputs.nextVersion }}
      previousVersion: ${{ steps.plan.outputs.previousVersion }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # The version is derived from the tags and the commits that followed them
          persist-credentials: false
      - name: 'Set up JDK 21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compute the release plan
        id: plan
        run: |
          ./gradlew writeSemverPlan --no-daemon
          cat build/semver/plan.properties >> "$GITHUB_OUTPUT"
          {
            echo '### Release plan'
            echo '```properties'
            cat build/semver/plan.properties
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        run: echo "No commit since v${{ steps.plan.outputs.previousVersion }} asks for a release."

  publish:
    name: Publish
    needs: plan
    if: needs.plan.outputs.release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 'Set up JDK 21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Tag v${{ needs.plan.outputs.nextVersion }}
        env:
          VERSION: ${{ needs.plan.outputs.nextVersion }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"

      # git-versioning reads GITHUB_REF on Actions, so checking the tag out does not change the version. Naming the tag
      # is what makes the steps below build the release version instead of a snapshot of the branch they run on.
      - name: Verify the version resolves to v${{ needs.plan.outputs.nextVersion }}
        env:
          VERSION: ${{ needs.plan.outputs.nextVersion }}
          VERSIONING_GIT_TAG: v${{ needs.plan.outputs.nextVersion }}
        run: |
          resolved=$(./gradlew --quiet properties --property version --no-daemon | awk '$1 == "version:" { print $2 }')
          if [ "$resolved" != "$VERSION" ]; then
            echo "::error::Gradle resolved the version as '$resolved', the release plan asked for '$VERSION'"
            exit 1
          fi

      - name: Create a release
        env:
          VERSIONING_GIT_TAG: v${{ needs.plan.outputs.nextVersion }}
        run: ./gradlew publish --no-daemon

      - name: Release to Maven Central
        env:
          VERSIONING_GIT_TAG: v${{ needs.plan.outputs.nextVersion }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jreleaserFullRelease --no-daemon --stacktrace
      # Persist logs
      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jreleaser-release
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
          if-no-files-found: ignore

  # A release created with GITHUB_TOKEN does not fire `release` events, so dispatch from here.
  notify-docs:
    name: Notify docs site
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create docs site token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: hominux.github.io
          permission-contents: write

      - name: Dispatch update to docs site
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: hominux/hominux.github.io
          event-type: update-docs
          client-payload: '{"repository": "${{ github.repository }}", "ref": "v${{ needs.plan.outputs.nextVersion }}"}'

  announce:
    name: Announce the release
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true' && !inputs.dry_run
    permissions: {}
    uses: hominux/.github/.github/workflows/announce-release.yml@243a86c4baffc1a0414be35e850f6ab480cdb3cf # main
    with:
      tag: v${{ needs.plan.outputs.nextVersion }}
    secrets:
      MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
